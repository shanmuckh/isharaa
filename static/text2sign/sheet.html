<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isharaa Sign Sheet</title>
<style>
  body { margin: 0; background: #050505; color: #ddd; font: 12px "Space Mono", ui-monospace, monospace; padding: 16px; }
  h1 { font-size: 15px; letter-spacing: 2px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  figure { margin: 0; border: 1px solid #333; background: #0d0d0d; padding: 6px; }
  .pair { display: flex; gap: 4px; }
  .pair img { width: 50%; display: block; }
  figcaption b { color: #fff; font-size: 13px; }
  figcaption span { display: block; color: #888; font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>
<h1>ISHARAA // ASL LEXICON KEYFRAME SHEET (START → END)</h1>
<div class="grid" id="grid"></div>
<script type="module">
// ?signs=HELLO,NAME   restrict to these glosses     ?view=front|side|close
import * as THREE from '../vendor/three.module.min.js';
import { Avatar, Hand, HandshapeLibrary, createStage } from './avatar.js';
import { Timeline } from './timeline.js';

const q = new URLSearchParams(location.search);
const data = await (await fetch('/api/sign-data')).json();
const lib = new HandshapeLibrary(data.handshapes);
const canvas = document.createElement('canvas');
canvas.width = 300; canvas.height = 330;
canvas.style.cssText = 'width:300px;height:330px;position:absolute;left:-9999px';
document.body.appendChild(canvas);
const stage = createStage(canvas);
stage.renderer.setPixelRatio(1);
stage.resize();
stage.renderer.setClearColor(0x101012, 1);
stage.camera.fov = 24;
stage.camera.position.set(-0.05, 1.47, 2.0);
stage.camera.lookAt(0, 1.37, 0);
stage.camera.updateProjectionMatrix();
if (q.get('view')) stage.setView(q.get('view'));
const avatar = new Avatar(lib);
stage.scene.add(avatar.group);
const mat = new THREE.MeshBasicMaterial();
const lexicon = { signs: { ...data.lexicon.signs, ...(data.captured || {}) } };
const tl = new Timeline(lib, lexicon, { r: new Hand(1, mat), l: new Hand(-1, mat) });

const shot = (t) => {
  avatar.setArm('r', tl.sample('r', t));
  avatar.setArm('l', tl.sample('l', t));
  avatar.setFace(tl.face(t));
  stage.render();
  return canvas.toDataURL();
};
const only = q.get('signs') ? q.get('signs').split(',') : null;
const grid = document.getElementById('grid');
for (const [id, sign] of Object.entries(lexicon.signs)) {
  if (only && !only.includes(id)) continue;
  tl.compile({ items: [{ kind: 'sign', id, gloss: id }], nmm: [] });
  const seg = tl.segments[0];
  const keys = tl.tracks.r.filter((k) => k.t > seg.t0 && k.t <= seg.t1);
  // captured signs: two moments inside the performance; authored: start and end
  const [a, b] = sign.clip
    ? [shot(seg.t0 + 0.45 * (seg.t1 - seg.t0)), shot(seg.t0 + 0.8 * (seg.t1 - seg.t0))]
    : [shot(keys[0].t), shot(seg.t1)];
  const fig = document.createElement('figure');
  fig.innerHTML = `<div class="pair"><img src="${a}"><img src="${b}"></div><figcaption><b>${id}</b><span>${sign.desc || ''}</span></figcaption>`;
  grid.appendChild(fig);
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
